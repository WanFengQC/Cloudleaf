[workspace]
members = [
    "crates/cloudleaf-types",
    "crates/cloudleaf-pinyin",
    "crates/cloudleaf-dictionary",
    "crates/cloudleaf-candidate",
    "crates/cloudleaf-input",
    "apps/cloudleaf-cli",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90.0"
license = "MIT"
publish = false

[workspace.dependencies]
cloudleaf-types = { path = "crates/cloudleaf-types", version = "=0.1.0" }
cloudleaf-pinyin = { path = "crates/cloudleaf-pinyin", version = "=0.1.0" }
cloudleaf-dictionary = { path = "crates/cloudleaf-dictionary", version = "=0.1.0" }
cloudleaf-candidate = { path = "crates/cloudleaf-candidate", version = "=0.1.0" }
cloudleaf-input = { path = "crates/cloudleaf-input", version = "=0.1.0" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
