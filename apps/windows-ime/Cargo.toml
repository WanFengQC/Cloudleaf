[package]
name = "cloudleaf-windows-ime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "cloudleaf_windows_ime"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "cloudleaf-ime"
path = "src/main.rs"

[dependencies]
cloudleaf-types.workspace = true
cloudleaf-input.workspace = true
cloudleaf-dictionary.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Ole", "Win32_System_Variant", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_TextServices", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_Security"] }
windows-core = "=0.62.2"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = "warn"
