[package]
name = "cloudleaf-translation-panel"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
cloudleaf-translation.workspace = true
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
zeroize = "=1.8.2"
ring = "=0.17.14"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security_Credentials", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Ole", "Win32_System_LibraryLoader", "Win32_Graphics_Gdi", "Win32_UI_Controls", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_Storage_FileSystem", "Win32_UI_Input_KeyboardAndMouse"] }

[lints.rust]
unsafe_code = "warn"

[lints.clippy]
all = "warn"
