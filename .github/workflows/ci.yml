name: Core CI

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8

jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned Rust
        run: rustup toolchain install 1.90.0 --profile minimal --component clippy --component rustfmt
      - name: Fetch precisely locked build dependencies
        run: cargo fetch --locked
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked --offline -- -D warnings
      - name: Tests and fixed input corpus
        run: cargo test --workspace --all-targets --locked --offline
      - name: Documentation tests
        run: cargo test --workspace --doc --locked --offline
      - name: Release workspace build
        run: cargo build --workspace --release --locked --offline
      - name: Dependency, license and fixture audit
        run: python scripts/check_workspace.py
      - name: Install pinned development vulnerability auditor
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Exact input snapshot and Windows dependency audit
        run: python scripts/audit_windows_dependencies.py --output .local/input-dependency-audit.json
      - name: Evaluation and artifact provenance tests
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Benchmark smoke
        run: python scripts/benchmark.py --iterations 100 --output .local/m2-performance.json
      - name: Algorithm baseline and ablation
        run: python scripts/evaluate_algorithms.py --output-dir .local/algorithm-v1
      - name: Build offline research tools
        run: cargo build -p cloudleaf-input --examples --release --locked --offline
      - name: Upload Windows experimental input tools
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: input-round16-windows
          path: |
            target/release/cloudleaf-cli.exe
            target/release/cloudleaf-ime.exe
            target/release/cloudleaf_windows_ime.dll
            target/release/examples/input_trace.exe
            target/release/examples/train_language.exe
            LICENSE
            THIRD_PARTY_NOTICES.md
            licenses/windows/
            licenses/input-snapshot/
            licenses/input-context/
            docs/input-round14-design.md
            docs/input-round15-design.md
            docs/input-round16-design.md
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: core-performance-${{ matrix.os }}
          path: |
            .local/m2-performance.json
            .local/algorithm-v1/
            .local/input-dependency-audit.json
