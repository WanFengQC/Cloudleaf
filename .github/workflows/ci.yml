name: Core CI

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8

jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned Rust
        run: rustup toolchain install 1.90.0 --profile minimal --component clippy --component rustfmt
      - name: Fetch precisely locked build dependencies
        run: cargo fetch --locked
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked --offline -- -D warnings
      - name: Tests and fixed input corpus
        run: cargo test --workspace --all-targets --locked --offline
      - name: Documentation tests
        run: cargo test --workspace --doc --locked --offline
      - name: Release workspace build
        run: cargo build --workspace --release --locked --offline
      - name: Dependency, license and fixture audit
        run: python scripts/check_workspace.py
      - name: Install pinned development vulnerability auditor
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Exact input snapshot and Windows dependency audit
        run: python scripts/audit_windows_dependencies.py --output .local/input-dependency-audit.json
      - name: Offline vendor source and license audit
        run: python scripts/check_offline_vendor.py .
      - name: Translation dependency license originals and RustSec audit
        run: python scripts/audit_translation_dependencies.py --output .local/translation-dependency-audit.json
      - name: Evaluation and artifact provenance tests
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Benchmark smoke
        run: python scripts/benchmark.py --iterations 100 --output .local/m2-performance.json
      - name: Algorithm baseline and ablation
        run: python scripts/evaluate_algorithms.py --output-dir .local/algorithm-v1
      - name: Build input and offline model research tools
        run: cargo build -p cloudleaf-input -p cloudleaf-search -p cloudleaf-offline -p cloudleaf-translation --examples --release --locked --offline
      - name: Upload Windows input and translation integration tools
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: integration-round25-windows
          path: |
            target/release/cloudleaf-cli.exe
            target/release/cloudleaf-ime.exe
            target/release/cloudleaf_windows_ime.dll
            target/release/cloudleaf-translation-panel.exe
            target/release/cloudleaf-bridge-headless.exe
            target/release/cloudleaf-translation-worker.exe
            target/release/examples/inspect_marian_weights.exe
            target/release/examples/offline_models.exe
            target/release/examples/offline_translate.exe
            target/release/examples/offline_lifecycle.exe
            target/release/examples/input_trace.exe
            target/release/examples/research_rank.exe
            target/release/examples/recall_diagnose.exe
            target/release/examples/language_audit.exe
            target/release/examples/dictionary_lookup.exe
            target/release/examples/train_language.exe
            target/release/examples/coverage_probe.exe
            target/release/examples/scheme_trace.exe
            LICENSE
            THIRD_PARTY_NOTICES.md
            licenses/windows/
            licenses/input-snapshot/
            licenses/input-context/
            licenses/translation/
            apps/cloudleaf-translation-panel/README.md
            crates/cloudleaf-offline/README.md
            crates/cloudleaf-bridge/README.md
            config/offline-models/
            config/offline-runtime-source-patches.json
            data/sources/locks/
            docs/input-round14-design.md
            docs/input-round15-design.md
            docs/input-round16-design.md
            docs/input-round17-design.md
            docs/input-round18-design.md
            docs/input-round19-design.md
            docs/input-round20-design.md
            docs/testing/round20-windows-manual-acceptance.md
            docs/integration-round21-design.md
            docs/integration-round22-design.md
            docs/integration-round23-design.md
            docs/integration-round24-design.md
            docs/integration-round25-design.md
            docs/integration-round25-worker-design.md
            docs/testing/round22-native-translation-manual.md
          if-no-files-found: error
      - name: Upload Linux headless integration tools
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: integration-round25-linux
          path: |
            target/release/cloudleaf-cli
            target/release/cloudleaf-bridge-headless
            target/release/cloudleaf-translation-worker
            target/release/examples/input_trace
            target/release/examples/research_rank
            target/release/examples/recall_diagnose
            target/release/examples/language_audit
            target/release/examples/dictionary_lookup
            target/release/examples/inspect_marian_weights
            target/release/examples/offline_models
            target/release/examples/offline_translate
            target/release/examples/offline_lifecycle
            LICENSE
            THIRD_PARTY_NOTICES.md
            licenses/input-snapshot/
            licenses/input-context/
            licenses/translation/
            crates/cloudleaf-offline/README.md
            crates/cloudleaf-bridge/README.md
            config/offline-models/
            config/offline-runtime-source-patches.json
            data/sources/locks/
            docs/integration-round21-design.md
            docs/integration-round22-design.md
            docs/integration-round23-design.md
            docs/integration-round24-design.md
            docs/integration-round25-design.md
            docs/integration-round25-worker-design.md
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: core-performance-${{ matrix.os }}
          path: |
            .local/m2-performance.json
            .local/algorithm-v1/
            .local/input-dependency-audit.json
            .local/translation-dependency-audit.json
