[package]
name = "cloudleaf-translation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
reqwest = { version = "=0.13.3", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
tokio = { version = "=1.54.1", features = ["rt", "time", "net", "sync", "macros"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
ring = "=0.17.14"
zeroize = "=1.8.2"

[dev-dependencies]
cloudleaf-input.workspace = true
cloudleaf-dictionary.workspace = true
cloudleaf-types.workspace = true

[lints]
workspace = true
